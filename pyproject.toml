[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magnavlab"
version = "0.1.0"
description = "Modularna biblioteka do eksperymentów z nawigacją magnetyczną (MagNav)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter", "nbconvert"]

[tool.setuptools]
packages = ["magnavlab", "magnavlab.io", "magnavlab.calibration", "magnavlab.models", "magnavlab.filters"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
